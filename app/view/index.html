<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
    <title>自动放烟火</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
        }

        #fireworks {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #imageInput {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1;
        }
    </style>
</head>

<body>
    <input type="file" id="imageInput" accept="image/*">
    <canvas id="fireworks"></canvas>
    <script>
        const canvas = document.getElementById('fireworks');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const fireworks = [];
        const particles = [];
        const images = [];
        let userImage = null;

        const imageInput = document.getElementById('imageInput');
        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    userImage = img;
                };
                reader.readAsDataURL(file);
            }
        });

        const particleColors = ['red', 'blue', 'yellow', 'white', 'green', 'purple'];

        function getRandomParticleColor() {
            const randomIndex = Math.floor(Math.random() * particleColors.length);
            return particleColors[randomIndex];
        }

        class Firework {
            constructor(x, y, targetY) {
                this.x = x;
                this.y = y;
                this.targetY = targetY;
                this.speed = Math.random() * 5 + 3;
                this.color = getRandomParticleColor();
                this.trail = [];
                this.trailType = Math.random() > 0.5? 'spiral' : 'blinking';
                this.angle = 0;
                this.blinkCounter = 0;
            }

            update() {
                if (this.trailType === 'spiral') {
                    this.angle += 0.1;
                    const radius = this.speed * this.trail.length * 0.1;
                    this.x += Math.cos(this.angle) * radius;
                    this.y -= this.speed;
                } else if (this.trailType === 'blinking') {
                    this.blinkCounter++;
                    if (this.blinkCounter % 3 === 0) {
                        this.trail.push({ x: this.x, y: this.y, color: this.color, alpha: 1 });
                    }
                    this.y -= this.speed;
                } else {
                    this.trail.push({ x: this.x, y: this.y, color: this.color, alpha: 1 });
                    this.y -= this.speed;
                }

                if (this.trail.length > 20) {
                    this.trail.shift();
                }

                if (this.y <= this.targetY) {
                    this.explode();
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();

                for (let i = 0; i < this.trail.length; i++) {
                    const trailPoint = this.trail[i];
                    trailPoint.alpha -= 0.05;
                    if (trailPoint.alpha <= 0) {
                        continue;
                    }
                    ctx.beginPath();
                    ctx.arc(trailPoint.x, trailPoint.y, 2, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${parseInt(trailPoint.color.slice(4, -1).split(',')[0])}, ${parseInt(trailPoint.color.slice(4, -1).split(',')[1])}, ${parseInt(trailPoint.color.slice(4, -1).split(',')[2])}, ${trailPoint.alpha})`;
                    ctx.fill();
                }
            }

            explode() {
                const explosionColor = getRandomParticleColor();
                for (let i = 0; i < 200; i++) {
                    const speed = (Math.random() * 1) + 1;
                    const angle = Math.random() * Math.PI * 2;
                    const speedX = Math.cos(angle) * speed;
                    const speedY = Math.sin(angle) * speed;
                    particles.push(new Particle(this.x, this.y, explosionColor, speedX, speedY));
                }
                const index = fireworks.indexOf(this);
                if (index > -1) {
                    fireworks.splice(index, 1);
                }
                if (userImage) {
                    images.push({
                        x: this.x,
                        y: this.y,
                        image: userImage,
                        startTime: Date.now()
                    });
                }
            }
        }

        class Particle {
            constructor(x, y, color, speedX, speedY) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.speedX = speedX;
                this.speedY = speedY;
                this.alpha = 1;
                this.fadeSpeed = (Math.random() * 0.01) + 0.005;
                this.gravity = 0.05;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.speedY += this.gravity;
                this.alpha -= this.fadeSpeed;
                if (this.alpha <= 0) {
                    const index = particles.indexOf(this);
                    if (index > -1) {
                        particles.splice(index, 1);
                    }
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        function createFirework(x, y) {
            const targetY = Math.random() * canvas.height * 0.3;
            fireworks.push(new Firework(x, y, targetY));
        }

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            createFirework(x, y);
        });

        setInterval(() => {
            const x = Math.random() * canvas.width;
            const y = canvas.height;
            createFirework(x, y);
        }, 2000);

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            fireworks.forEach(firework => {
                firework.update();
                firework.draw();
            });

            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });

            images.forEach((imageObj, index) => {
                if (Date.now() - imageObj.startTime < 1000) {
                    // 这里将图片宽度和高度缩小为原来的 0.2 倍，你可以根据需要调整这个比例
                    const scaledWidth = imageObj.image.width * 0.2;
                    const scaledHeight = imageObj.image.height * 0.2;
                    ctx.drawImage(imageObj.image, imageObj.x - scaledWidth / 2, imageObj.y - scaledHeight / 2, scaledWidth, scaledHeight);
                } else {
                    images.splice(index, 1);
                }
            });

            requestAnimationFrame(animate);
        }

        animate();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>

</html>
